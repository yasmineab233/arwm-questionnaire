<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARWM · Diagnostic Durabilité 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --vert:#1B5E48;--terre:#BE6A41;--eau:#2D6E84;--sauge:#5E8A6F;--safran:#C89A3E;
  --vert-p:#D9E2D6;--eau-p:#D8E5E8;--terre-p:#F0DCCE;--safran-p:#F0E3C3;
  --encre:#20241F;--encre-d:#4C5048;--st:#DED3BC;--sp:#EBE3D2;--sf:#F4EEE1;--pk:#FBF8F0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--sf);color:var(--encre);font-family:'Archivo',sans-serif;font-size:14px;line-height:1.65;padding-bottom:4rem}
.wrap{max-width:680px;margin:0 auto;padding:2rem 1rem}
/* LANG BAR */
.lb{position:sticky;top:0;z-index:100;background:var(--encre);display:flex;align-items:center;justify-content:space-between;padding:.55rem 1.5rem;gap:12px}
.lb-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#555}
.lb-btns{display:flex;gap:5px}
.lb-btn{padding:4px 13px;font-size:10.5px;font-family:'Archivo',sans-serif;border:1px solid #3A3A38;cursor:pointer;background:transparent;color:#888;letter-spacing:.04em;transition:all .15s}
.lb-btn:hover{border-color:#666;color:#ccc}
.lb-btn.active{background:var(--sf);border-color:var(--sf);color:var(--encre);font-weight:700}
/* PROGRESS */
.prog-wrap{margin-bottom:2rem}
.prog-meta{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-d);margin-bottom:5px}
.prog-track{height:1.5px;background:var(--sp)}
.prog-fill{height:100%;background:var(--encre);transition:width .3s;width:0}
/* DOC HEADER */
.doc-hdr{border-bottom:1.5px solid var(--encre);padding-bottom:1.5rem;margin-bottom:2rem}
.doc-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--encre-d);margin-bottom:.45rem}
.doc-title{font-size:26px;font-weight:700;line-height:1.2;color:var(--encre);margin-bottom:.35rem}
.doc-sub{font-family:'Spectral',serif;font-style:italic;font-size:13px;color:var(--encre-d)}
/* INTRO */
.intro-box{background:var(--pk);border:1px solid var(--st);padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.intro-box p{font-family:'Spectral',serif;font-size:13.5px;line-height:1.8;color:var(--encre-d)}
.note-bar{background:var(--safran-p);border-left:3px solid var(--safran);padding:.875rem 1.25rem;margin-bottom:2rem}
.note-bar p{font-size:13px;color:#4A3400;line-height:1.6}
/* CATEGORY SECTION */
.cat-sec{margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid var(--st)}
.cat-step-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--encre-d);margin-bottom:.3rem}
.cat-sec-title{font-size:20px;font-weight:700;color:var(--encre);margin-bottom:.5rem}
.cat-sec-intro{font-family:'Spectral',serif;font-size:13.5px;color:var(--encre-d);margin-bottom:1rem;line-height:1.7}
.cat-cont{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem;padding:.5rem .875rem;background:var(--sp);border:1px solid var(--st)}
.cat-cont-end{font-size:11px;font-weight:600;color:var(--encre-d)}
.cat-cont-arr{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--encre-d)}
.cat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:.875rem}
.cat-card{border:1.5px solid var(--st);padding:1rem;cursor:pointer;transition:all .15s;background:var(--pk)}
.cat-card:hover{border-color:var(--encre-d);background:var(--sf)}
.cat-card.sel[data-cat="A"]{border-color:var(--eau);background:var(--eau-p)}
.cat-card.sel[data-cat="B"]{border-color:var(--vert);background:var(--vert-p)}
.cat-card.sel[data-cat="C"]{border-color:var(--safran);background:var(--safran-p)}
.cat-ltr{font-size:26px;font-weight:700;color:var(--encre-d);margin-bottom:.2rem;line-height:1}
.cat-card.sel[data-cat="A"] .cat-ltr{color:var(--eau)}
.cat-card.sel[data-cat="B"] .cat-ltr{color:var(--vert)}
.cat-card.sel[data-cat="C"] .cat-ltr{color:var(--safran)}
.cat-name{font-size:11.5px;font-weight:700;color:var(--encre);margin-bottom:.2rem}
.cat-desc-t{font-family:'Spectral',serif;font-size:11px;color:var(--encre-d);line-height:1.5}
.cat-note{font-family:'Spectral',serif;font-style:italic;font-size:12px;color:var(--encre-d);padding:.625rem .875rem;border-left:3px solid var(--st)}
/* PROFILE */
.pf-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-d);font-weight:700;margin-bottom:.6rem}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:2rem}
.pf-field{display:flex;flex-direction:column;gap:3px}
.pf-field label{font-size:9px;color:var(--encre-d);text-transform:uppercase;letter-spacing:.08em}
.pf-field input{height:33px;border:1px solid var(--st);padding:0 9px;font-size:13px;font-family:'Archivo',sans-serif;color:var(--encre);background:var(--pk);outline:none;-webkit-appearance:none;transition:border .12s}
.pf-field input:focus{border-color:var(--encre-d)}
/* CRITERIA EXPLANATION */
.crit-expl{background:var(--pk);border-left:3px solid var(--encre-d);padding:.875rem 1.25rem;margin-bottom:2rem;display:flex;flex-direction:column;gap:7px}
.crit-row{display:flex;align-items:flex-start;gap:10px;font-family:'Spectral',serif;font-size:13px;line-height:1.55;color:var(--encre-d)}
.crit-bdg{font-family:'Archivo',sans-serif;font-size:9.5px;font-weight:700;padding:2px 7px;flex-shrink:0;margin-top:1px;letter-spacing:.04em}
.crit-bdg.m{background:var(--encre);color:var(--sf)}
.crit-bdg.g{background:var(--sp);color:var(--encre-d);border:1px solid var(--st)}
/* SECTION DIVIDERS */
.sec-div{margin:2.5rem 0 .75rem;display:flex;align-items:center;gap:12px}
.sec-pill{display:flex;align-items:center;gap:10px;padding:0 0 0 12px;flex-shrink:0}
.sec-num{font-size:11px;font-weight:700;opacity:.4}
.sec-title{font-size:17px;font-weight:700}
.sec-desc{font-family:'Spectral',serif;font-style:italic;font-size:13.5px;color:var(--encre-d);margin-bottom:1.125rem;line-height:1.7}
.pv .sec-pill{border-left:3px solid var(--vert)} .pv .sec-num,.pv .sec-title{color:var(--vert)}
.pt .sec-pill{border-left:3px solid var(--terre)} .pt .sec-num,.pt .sec-title{color:var(--terre)}
.pe .sec-pill{border-left:3px solid var(--eau)} .pe .sec-num,.pe .sec-title{color:var(--eau)}
.ps .sec-pill{border-left:3px solid var(--sauge)} .ps .sec-num,.ps .sec-title{color:var(--sauge)}
.pf .sec-pill{border-left:3px solid var(--safran)} .pf .sec-num,.pf .sec-title{color:var(--safran)}
/* QUESTION CARDS */
.q-card{background:var(--pk);border:1px solid var(--st);padding:.875rem 1.125rem;margin-bottom:.5rem}
.q-row{display:flex;align-items:flex-start;gap:11px}
.q-num{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--encre-d);min-width:26px;padding-top:2px;flex-shrink:0}
.q-body{flex:1}
.q-text{font-family:'Spectral',serif;font-size:13.5px;line-height:1.6;color:var(--encre)}
.q-note{font-family:'Spectral',serif;font-style:italic;font-size:12px;color:var(--encre-d);margin-top:3px}
.q-pts{font-size:9px;background:var(--sp);color:var(--encre-d);padding:2px 6px;margin-left:auto;flex-shrink:0}
.q-opts{display:flex;flex-direction:column;gap:4px;margin-top:.7rem;margin-left:37px}
.q-btn{display:flex;align-items:flex-start;gap:8px;padding:7px 11px;font-family:'Spectral',serif;font-size:13px;border:1px solid var(--st);cursor:pointer;background:transparent;color:var(--encre-d);text-align:left;line-height:1.45;transition:all .12s;width:100%}
.q-btn:hover{border-color:var(--sp);background:var(--sf);color:var(--encre)}
.opt-l{font-family:'Archivo',sans-serif;font-size:9.5px;font-weight:700;width:15px;height:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.opt-l.a{background:#C5E0A8;color:#1A4A00}.opt-l.b{background:#F5DFB0;color:#5A3800}.opt-l.c{background:#F0CCCC;color:#5A1010}
.q-btn.sel-a{background:#EAF4D4;border-color:#7AB840;color:#1A4A00}
.q-btn.sel-b{background:#FBF0D5;border-color:#B89020;color:#5A3800}
.q-btn.sel-c{background:#F9E0E0;border-color:#B84040;color:#5A1010}
.q-open{margin-top:.7rem;margin-left:37px}
.q-open-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-d);margin-bottom:4px}
.q-open textarea{width:100%;height:68px;border:1px solid var(--st);padding:7px 10px;font-size:13px;font-family:'Spectral',serif;color:var(--encre);background:var(--pk);resize:vertical;outline:none;transition:border .12s}
.q-open textarea:focus{border-color:var(--encre-d)}
/* CTA */
.cta-wrap{display:flex;justify-content:center;margin-top:2.5rem}
.cta-btn{padding:11px 30px;font-size:11px;font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.12em;border:2px solid var(--encre);cursor:pointer;background:var(--encre);color:var(--sf);text-transform:uppercase;transition:all .15s}
.cta-btn:hover{background:var(--sf);color:var(--encre)}
/* ══ RESULTS ══ */
.res-wrap{margin-top:3rem;display:none}
.res-wrap.show{display:block}
.res-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--encre-d);margin:2rem 0 .75rem;padding-top:1.75rem;border-top:1px solid var(--st)}
/* Flow bar */
.flow-bar{display:flex;align-items:center;margin-bottom:1.5rem;padding:.75rem 1rem;background:var(--pk);border:1px solid var(--st);overflow-x:auto}
.flow-step{flex:1;text-align:center;padding:.25rem .125rem;min-width:72px}
.flow-n{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin:0 auto .2rem;flex-shrink:0}
.flow-lbl{font-size:8px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.flow-step.done .flow-n{background:var(--vert-p);color:var(--vert);border:1.5px solid var(--vert)}
.flow-step.done .flow-lbl{color:var(--vert)}
.flow-step.cur .flow-n{background:var(--vert);color:#fff}
.flow-step.cur .flow-lbl{color:var(--encre);font-weight:700}
.flow-step.nxt .flow-n{background:var(--sp);color:var(--encre-d);border:1px solid var(--st)}
.flow-step.nxt .flow-lbl{color:var(--encre-d)}
.flow-arr{font-size:14px;color:var(--st);flex-shrink:0;padding:0 1px}
/* Category display */
.cat-display{display:flex;align-items:center;gap:14px;padding:.875rem 1.25rem;background:var(--pk);border:1.5px solid var(--encre);margin-bottom:1.25rem}
.cat-disp-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-d)}
.cat-disp-val{font-size:32px;font-weight:700;color:var(--vert);line-height:1}
.cat-disp-name{font-family:'Spectral',serif;font-size:13px;color:var(--encre-d)}
/* Gate */
.gate{padding:1.125rem 1.5rem;border:1.5px solid;margin-bottom:1.375rem}
.gate.closed{border-color:var(--terre);background:var(--terre-p)}.gate.indet{border-color:var(--safran);background:var(--safran-p)}.gate.open{border-color:var(--vert);background:var(--vert-p)}
.gate-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:.5rem}
.gate.closed .gate-lbl{color:var(--terre)}.gate.indet .gate-lbl{color:#7A5A00}.gate.open .gate-lbl{color:var(--vert)}
.gate-body{font-family:'Spectral',serif;font-size:13px;line-height:1.75;color:var(--encre)}
/* Score cells */
.score-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1.25rem}
.sc{background:var(--pk);border:1px solid var(--st);padding:.75rem 1rem}
.sc-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-d);margin-bottom:3px}
.sc-val{font-size:20px;font-weight:700;color:var(--encre);line-height:1}
.sc-sub{font-family:'Spectral',serif;font-style:italic;font-size:11px;color:var(--encre-d);margin-top:2px}
/* Level badge */
.lvl{display:flex;align-items:flex-start;gap:14px;padding:1.125rem 1.5rem;border:1.5px solid;margin-bottom:1rem}
.lvl-icon{font-size:26px;flex-shrink:0;line-height:1}
.lvl-name{font-size:17px;font-weight:700;margin-bottom:2px}
.lvl-note{font-family:'Spectral',serif;font-style:italic;font-size:12px;color:var(--encre-d)}
.lvl.blocked{border-color:var(--terre);background:var(--terre-p)}.lvl.blocked .lvl-name{color:var(--terre)}
.lvl.bronze{border-color:#BE8A55;background:#FFF5EC}.lvl.bronze .lvl-name{color:#7A4A10}
.lvl.silver{border-color:#8A9AA8;background:#F3F5F8}.lvl.silver .lvl-name{color:#404E5A}
.lvl.gold{border-color:var(--safran);background:var(--safran-p)}.lvl.gold .lvl-name{color:#7A5A00}
/* Gap to next level */
.gap-ind{background:var(--safran-p);border:1px solid var(--safran);padding:.875rem 1.25rem;margin-bottom:1.375rem}
.gap-ind.achieved{background:var(--vert-p);border-color:var(--vert)}
.gap-ind-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.5rem;flex-wrap:wrap;gap:4px}
.gap-ind-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#7A5A00}
.gap-ind.achieved .gap-ind-lbl{color:var(--vert)}
.gap-ind-pts{font-size:13px;color:var(--encre)}
.gap-track{height:5px;background:var(--sp)}
.gap-fill{height:100%;background:var(--safran);transition:width .6s}
.gap-ind.achieved .gap-fill{background:var(--vert)}
/* Pillar bars */
.pbar-row{margin-bottom:.875rem}
.pbar-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:3px}
.pbar-name{font-weight:600}
.pbar-info{font-size:10px;letter-spacing:.03em;color:var(--encre-d)}
.pbar-track{height:8px;background:var(--sp);display:flex}
.pbar-m{height:100%;transition:width .5s}
.pbar-g{height:100%;opacity:.4;transition:width .5s .15s}
.pbar-leg{display:flex;gap:14px;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--encre-d);margin-top:2px}
/* Strengths & Gaps */
.sg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.sg-box{border:1px solid;padding:.875rem 1rem}
.sg-box.str{border-color:var(--vert);background:var(--vert-p)}
.sg-box.gap{border-color:var(--terre);background:var(--terre-p)}
.sg-title{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:.5rem}
.sg-box.str .sg-title{color:var(--vert)}
.sg-box.gap .sg-title{color:var(--terre)}
.sg-item{font-family:'Spectral',serif;font-size:12.5px;color:var(--encre-d);padding:.3rem 0;border-bottom:1px solid transparent;display:flex;align-items:flex-start;gap:6px;line-height:1.4}
.sg-item small{font-size:10px;opacity:.75;flex-shrink:0}
/* Priority pillars */
.prio-list{display:flex;flex-direction:column;gap:7px;margin-bottom:1rem}
.prio-item{display:flex;align-items:flex-start;gap:12px;padding:.875rem 1rem;background:var(--pk);border:1px solid var(--st)}
.prio-num{width:22px;height:22px;background:var(--encre);color:var(--sf);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.prio-pillar{font-weight:700;font-size:13px;margin-bottom:3px}
.prio-action{font-family:'Spectral',serif;font-size:12.5px;color:var(--encre-d);line-height:1.5}
/* Mandatory gap list */
.mgap-list{display:flex;flex-direction:column;gap:5px}
.mgap-item{display:flex;align-items:flex-start;gap:10px;padding:.6rem .875rem;background:var(--terre-p);border-left:3px solid var(--terre)}
.mgap-code{font-size:9px;font-weight:700;color:var(--terre);letter-spacing:.06em;min-width:36px;flex-shrink:0;padding-top:2px}
.crit-tag{display:inline-block;font-size:8.5px;font-weight:700;padding:1px 5px;letter-spacing:.04em;margin-right:3px}
.crit-tag.mu{background:var(--terre-p);color:var(--terre);border:1px solid var(--terre)}
.crit-tag.mp{background:var(--safran-p);color:#7A5A00;border:1px solid var(--safran)}
.mgap-title{font-family:'Spectral',serif;font-size:13px;color:var(--encre);margin-top:2px}
/* Action plan table */
.aplan-wrap{overflow-x:auto;margin-bottom:.5rem}
.aplan-table{width:100%;border-collapse:collapse;font-size:12px;min-width:560px}
.aplan-table th{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-d);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--encre);background:var(--sp);white-space:nowrap}
.aplan-table td{padding:7px 8px;border-bottom:1px solid var(--st);vertical-align:middle}
.aplan-table tr:last-child td{border-bottom:none}
.plan-pri{font-size:8.5px;font-weight:700;letter-spacing:.06em;padding:2px 6px;white-space:nowrap;text-transform:uppercase;display:inline-block}
.plan-title{font-weight:600;font-size:12.5px;color:var(--encre);line-height:1.35;margin-bottom:2px}
.plan-code{font-size:9px;color:var(--encre-d);letter-spacing:.05em}
/* Tier groups */
.tier-group{margin-bottom:1.5rem}
.tier-hdr{display:flex;align-items:center;gap:10px;margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:1px solid var(--st)}
.tier-bdg{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 8px}
.tier-cnt{font-size:11px;color:var(--encre-d)}
.tier-desc{font-family:'Spectral',serif;font-style:italic;font-size:12px;color:var(--encre-d);margin-bottom:.625rem}
.tier-collapsed{font-family:'Spectral',serif;font-style:italic;font-size:12.5px;color:var(--encre-d);background:var(--sp);border:1px solid var(--st);padding:.625rem 1rem;margin-top:.5rem}
/* Fiche cards (title first) */
.fiche-card{background:var(--pk);border:1px solid var(--st);margin-bottom:.5rem;display:flex;overflow:hidden}
.fiche-bar{width:4px;flex-shrink:0}
.fiche-inner{flex:1;padding:.875rem 1rem}
.fiche-title{font-weight:600;font-size:13.5px;color:var(--encre);margin-bottom:.375rem;line-height:1.4}
.fiche-meta{display:flex;align-items:center;gap:6px;margin-bottom:.5rem;flex-wrap:wrap}
.fiche-code{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--encre-d);background:var(--sp);padding:2px 6px}
.fiche-sep{color:var(--st);font-size:12px}
.fiche-plbl{font-size:9px;color:var(--encre-d)}
.notation{display:flex;border:1px solid var(--st);margin-bottom:.5rem}
.ind{flex:1;padding:5px 3px;border-right:1px solid var(--st);text-align:center;min-width:0}
.ind:last-child{border-right:none}
.ind-l{font-size:7px;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-d);margin-bottom:2px}
.ind-d{display:flex;justify-content:center;gap:2px;margin-bottom:2px}
.ind-v{font-size:7.5px;color:var(--encre-d);font-weight:600}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.on{background:currentColor}.dot.off{border:1.5px solid currentColor;background:transparent;width:5px;height:5px}
.fiche-bdgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:.5rem}
.fbdg{font-size:8px;font-weight:500;padding:2px 7px;border:1px solid;border-radius:9999px;letter-spacing:.03em}
/* Unknown section */
.unk-list{border:1px solid var(--st);opacity:.7}
.unk-item{display:flex;align-items:center;gap:10px;padding:.5rem .875rem;border-bottom:1px solid var(--st);font-size:13px}
.unk-item:last-child{border-bottom:none}
.unk-code{font-size:9px;font-weight:700;letter-spacing:.06em;color:var(--encre-d);min-width:38px;flex-shrink:0}
.unk-title{font-family:'Spectral',serif;color:var(--encre-d)}
/* Q20 result */
.q20-res{background:var(--vert-p);border-left:3px solid var(--vert);padding:.875rem 1.25rem}
.q20-res-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--vert);margin-bottom:.375rem}
.q20-res-text{font-family:'Spectral',serif;font-style:italic;font-size:14px;color:var(--encre);line-height:1.7}
/* Share */
.share-wrap{display:flex;justify-content:center;margin-top:1.5rem}
.share-btn{padding:8px 20px;font-size:10px;font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--st);cursor:pointer;background:var(--pk);color:var(--encre-d);transition:all .15s}
.share-btn:hover{border-color:var(--encre-d);color:var(--encre)}
/* KEY SECTION */
.key-sec{margin-top:2.5rem;border-top:1px solid var(--st);padding-top:1.75rem}
.key-title{font-size:15px;font-weight:700;margin-bottom:1rem}
.key-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.5rem}
.key-card{border:1px solid;padding:.875rem 1rem}
.key-bdg{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;display:inline-block;margin-bottom:.35rem}
.key-card h4{font-size:13px;font-weight:700;color:var(--encre);margin-bottom:3px}
.key-card p{font-family:'Spectral',serif;font-size:12px;color:var(--encre-d);line-height:1.5}
.key-card.bronze{background:#FFF5EC;border-color:#BE8A55}.key-card.bronze .key-bdg{background:#FFE0CC;color:#7A3800}
.key-card.silver{background:#F3F5F8;border-color:#8A9AA8}.key-card.silver .key-bdg{background:#DDE0E8;color:#404E5A}
.key-card.gold{background:var(--safran-p);border-color:var(--safran)}.key-card.gold .key-bdg{background:#FFE890;color:#5A4000}
.pl-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-d);font-weight:700;margin-bottom:.4rem}
.pl-items{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.25rem}
.pl-item{display:flex;align-items:flex-start;gap:8px;font-family:'Spectral',serif;font-size:13px;color:var(--encre-d)}
.pl-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.fn-box{background:var(--sp);border:1px solid var(--st);padding:.875rem 1.25rem}
.fn-box p{font-family:'Spectral',serif;font-style:italic;font-size:13px;color:var(--encre-d);line-height:1.65}
/* RTL */
html[lang="ar"]{direction:rtl}
html[lang="ar"] body{font-family:'Segoe UI','Arial',sans-serif}
html[lang="ar"] .note-bar{border-left:none;border-right:3px solid var(--safran)}
html[lang="ar"] .cat-note{border-left:none;border-right:3px solid var(--st)}
html[lang="ar"] .crit-expl{border-left:none;border-right:3px solid var(--encre-d)}
html[lang="ar"] .pv .sec-pill,.pt .sec-pill,.pe .sec-pill,.ps .sec-pill,.pf .sec-pill{border-left:none;padding-left:0;padding-right:12px}
html[lang="ar"] .pv .sec-pill{border-right:3px solid var(--vert)}
html[lang="ar"] .pt .sec-pill{border-right:3px solid var(--terre)}
html[lang="ar"] .pe .sec-pill{border-right:3px solid var(--eau)}
html[lang="ar"] .ps .sec-pill{border-right:3px solid var(--sauge)}
html[lang="ar"] .pf .sec-pill{border-right:3px solid var(--safran)}
html[lang="ar"] .q-opts{margin-left:0;margin-right:37px}
html[lang="ar"] .q-open{margin-left:0;margin-right:37px}
html[lang="ar"] .q-row{flex-direction:row-reverse}
html[lang="ar"] .q-pts{margin-left:0;margin-right:auto}
html[lang="ar"] .q-btn{flex-direction:row-reverse;text-align:right}
html[lang="ar"] .mgap-item{border-left:none;border-right:3px solid var(--terre)}
html[lang="ar"] .q20-res{border-left:none;border-right:3px solid var(--vert)}
@media(max-width:520px){
  .key-grid,.score-cells,.cat-cards,.sg-grid{grid-template-columns:1fr}
  .pf-grid{grid-template-columns:1fr}
  .notation{flex-wrap:wrap}
  .ind{min-width:30%}
  .lb-lbl{display:none}
}

};

const BDG_LBL={a:'Contexte marocain',b:'Fort potentiel eau',c:'Économies immédiates',d:'Approv. local',e:'Champion déchets',f:'Facilement mesurable',g:'Partenaire local disponible',h:'Fort potentiel de réplication'};

const PILLARS={
  P1:{lbl:'Gouvernance & Management',col:'--vert',m:['M01','M02','M03','M04','M05'],g:['G06','G07','G08']},
  P2:{lbl:'Gestion des Déchets',col:'--terre',m:['M09','M10','M11','M12','M13','M14','M15'],g:['G16','G17','G18','G19','G20']},
  P3:{lbl:'Eau & Énergie',col:'--eau',m:['M21','M22','M23','M24','M28','M29','M30','M31','M32','M33','M34'],g:['G25','G26','G27','G35','G36','G37','G38']},
  P4:{lbl:'Approvisionnement Responsable',col:'--sauge',m:['M39','M40','M41','M42','M43'],g:['G44','G45','G46','G47','G48']},
  P5:{lbl:'Personnel & Opérations',col:'--safran',m:['M49','M50','M52','M53','M54','M58','M59','M60'],g:['G51','G55','G56','G57','G61','G62']}
};
const PCOL={G:'--vert',D:'--terre',E:'--eau',A:'--sauge',K:'--safran'};

// Pillar text for strengths/gaps
const PSTR={P1:'Pilotage et gouvernance bien structurés',P2:'Gestion des déchets efficacement mise en place',P3:'Maîtrise des consommations eau & énergie',P4:'Approvisionnement responsable engagé',P5:'Équipes formées et pratiques opérationnelles solides'};
const PGAP={P1:'Gouvernance & Management à formaliser',P2:'Gestion des déchets à structurer',P3:'Eau & Énergie : consommations à mieux piloter',P4:'Politique d\'achat responsable à développer',P5:'Formation et pratiques durables à initier'};
const PPRIO={P1:'Formaliser la politique environnementale, les indicateurs de suivi et le rôle du référent',P2:'Mettre en place le tri, la pesée des biodéchets et la valorisation des invendus',P3:'Installer des équipements hydro-économes et suivre les consommations eau & énergie',P4:'Identifier des producteurs locaux et formaliser la politique d\'achat',P5:'Désigner un référent durabilité et former l\'équipe aux bonnes pratiques'};

// Q → Pillar mapping for answer ratios
const QP={q1:'P2',q2:'P2',q3:'P2',q4:'P2',q5:'P3',q6:'P3',q7:'P3',q8:'P3',q9:'P4',q10:'P4',q11:'P4',q12:'P4',q13:'P5',q14:'P5',q15:'P5',q16:'P5',q17:'P1',q18:'P1',q19:'P1'};

// Official category thresholds (out of 108)
const CAT_TH={A:[15,25,40],B:[20,35,55],C:[25,50,75]};
const CAT_NAMES={A:'Fast-casual · Haut volume',B:'Mid-scale · Mixte',C:'Premium · Petit volume'};

const ACM={
  q1:{a:{M13:'p',G16:'p'},b:{M13:'p',G16:'u'},c:{M13:'u',G16:'u'}},
  q2:{a:{M11:'p',M12:'p'},b:{M11:'p',M12:'u'},c:{M11:'u',M12:'u'}},
  q3:{a:{M14:'s'},b:{M14:'p'},c:{M14:'u'}},
  q4:{a:{G17:'p'},b:{G17:'u'},c:{G17:'u'}},
  q5:{a:{M24:'p'},b:{M24:'p'},c:{M24:'u'}},
  q6:{a:{M21:'p'},b:{M21:'p'},c:{M21:'u'}},
  q7:{a:{M03:'p'},b:{M03:'p'},c:{M03:'u'}},
  q8:{a:{M09:'p',M10:'p',G27:'p'},b:{M09:'p',M10:'u'},c:{M09:'u',M10:'u'}},
  q9:{a:{M41:'p'},b:{M41:'p'},c:{M41:'u'}},
  q10:{a:{G44:'p'},b:{G44:'u'},c:{G44:'u'}},
  q11:{a:{M39:'p'},b:{M39:'p'},c:{M39:'u'}},
  q12:{a:{M43:'p'},b:{M43:'p'},c:{M43:'u'}},
  q13:{a:{M02:'p'},b:{M02:'p'},c:{M02:'u'}},
  q14:{a:{M01:'p'},b:{M01:'u'},c:{M01:'u'}},
  q15:{a:{M05:'p'},b:{M05:'p'},c:{M05:'u'}},
  q16:{a:{M13:'p'},b:{M13:'p'},c:{}},
  q17:{a:{M04:'p',M31:'p'},b:{M04:'p'},c:{M04:'u',M31:'u'}},
  q18:{a:{G16:'p'},b:{G16:'u'},c:{}},
  q19:{a:{G06:'p'},b:{G06:'u'},c:{G06:'u'}}
};

const RNK={s:2,p:1,u:0};
const SCORED=['q1','q2','q3','q4','q5','q6','q7','q8','q9','q10','q11','q12','q13','q14','q15','q16','q17','q18','q19'];
let answers={}, lang='fr', selectedCat=null, tiersCache={};

/* ══ CATEGORY ══ */
function selectCat(cat){
  selectedCat=cat;
  document.querySelectorAll('.cat-card').forEach(c=>c.classList.remove('sel'));
  document.querySelectorAll(`.cat-card[data-cat="${cat}"]`).forEach(c=>c.classList.add('sel'));
}
function computeCat(){
  if(selectedCat)return selectedCat;
  const cov=parseInt(document.getElementById('pf_covers').value)||0;
  return cov>=150?'A':cov<40?'C':'B';
}

/* ══ SELECTION ══ */
function sel(q,v,sc){
  answers[q]={v,sc};
  document.getElementById(q).querySelectorAll('.q-btn').forEach(b=>b.classList.remove('sel-a','sel-b','sel-c'));
  event.target.closest('.q-btn').classList.add('sel-'+v);
  updateProg();
}
function updateProg(){
  const d=SCORED.filter(q=>answers[q]).length;
  const pct=Math.round(d/SCORED.length*100);
  document.getElementById('progF').style.width=pct+'%';
  document.getElementById('progL').textContent=d+' / 19';
  document.getElementById('progP').textContent=pct+' %';
}

/* ══ CALCULATE ══ */
function calculate(){
  if(!selectedCat){alert(T[lang].cat_required);document.getElementById('catSection').scrollIntoView({behavior:'smooth'});return;}
  const miss=SCORED.filter(q=>!answers[q]).length;
  if(miss>5){alert(T[lang].alertMsg.replace('{n}',miss));return;}
  renderAll();
  const r=document.getElementById('resWrap');
  r.classList.add('show');
  setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),80);
}

/* ══ CORE SCORING ══ */
function toEq(raw){return Math.round(raw/38*108);}

function deriveCriteria(){
  const st={};
  function upd(c,v){if(!st[c]||RNK[v]>RNK[st[c]])st[c]=v;}
  SCORED.forEach(q=>{if(!answers[q])return;const m=ACM[q]?.[answers[q].v]||{};Object.keys(m).forEach(c=>upd(c,m[c]));});
  return st;
}

function pillarScores(cs){
  const out={};
  Object.keys(PILLARS).forEach(p=>{
    const pc=PILLARS[p];
    const mAs=pc.m.filter(c=>cs[c]);
    const mOk=mAs.filter(c=>cs[c]==='s'||cs[c]==='p').length;
    const mUn=mAs.filter(c=>cs[c]==='u').length;
    const mUnk=pc.m.length-mAs.length;
    const gAs=pc.g.filter(c=>cs[c]);
    const gOk=gAs.filter(c=>cs[c]==='s'||cs[c]==='p').length;
    out[p]={mAs:mAs.length,mOk,mUn,mUnk,gAs:gAs.length,gOk,mTot:pc.m.length,gTot:pc.g.length};
  });
  return out;
}

function weakestPillar(ps){
  let worst='P5',score=99;
  Object.keys(ps).forEach(p=>{const s=ps[p];const r=s.mAs===0?-1:s.mOk/s.mAs;if(r<score){score=r;worst=p;}});
  return worst;
}

function pillarAnswerRatios(){
  const sc={},mx={};
  Object.keys(QP).forEach(q=>{const p=QP[q];if(!sc[p]){sc[p]=0;mx[p]=0;}if(answers[q]){sc[p]+=answers[q].sc;mx[p]+=2;}});
  const r={};
  Object.keys(PILLARS).forEach(p=>{r[p]=mx[p]>0?sc[p]/mx[p]:null;});
  return r;
}

function activateFiches(cs){
  const out={};
  Object.keys(FICHES).forEach(code=>{
    const f=FICHES[code];let mGap=0,mPrt=0,gGap=0,allUnk=true;
    f.c.forEach(c=>{const isM=c.startsWith('M');const s=cs[c]||'k';if(s!=='k')allUnk=false;if(isM){if(s==='u')mGap++;else if(s==='p')mPrt++;}else{if(s==='u'||s==='p')gGap++;}});
    if(mGap||mPrt||gGap||allUnk)out[code]={mGap,mPrt,gGap,allUnk};
  });
  return out;
}

function assignTiers(act,weak){
  const T={1:[],2:[],3:[],4:[],5:[],6:[],k:[]};
  Object.keys(act).forEach(code=>{
    const a=act[code],f=FICHES[code];
    if(a.allUnk){T.k.push(code);return;}
    if(a.mGap>0){T[1].push(code);return;}
    if(a.mPrt>0){T[2].push(code);return;}
    if(a.gGap>0){const isWk=f.p===weak;const isQW=f.cx<=1&&f.iv<=1&&f.ho===1;const isHi=f.iv>=3||f.cx>=3;if(isWk)T[3].push(code);else if(isQW)T[4].push(code);else if(isHi)T[6].push(code);else T[5].push(code);}
  });
  [1,2].forEach(t=>T[t].sort((a,b)=>(act[b].mGap-act[a].mGap)||FICHES[b].im-FICHES[a].im));
  [3,4,5,6].forEach(t=>T[t].sort((a,b)=>FICHES[b].im-FICHES[a].im||FICHES[a].ro-FICHES[b].ro));
  return T;
}

function computeLevel(eq,cat,mGaps){
  const t=CAT_TH[cat]||CAT_TH.B;
  if(mGaps>2)return{cls:'blocked',icon:'⊘',name:'Non attribuable',note:`${mGaps} critères M bloquants identifiés`};
  if(mGaps>0)return{cls:'bronze',icon:'🥉',name:'Bronze (incomplet)',note:`${mGaps} critère(s) M bloquant(s) · résoudre avant certification`};
  if(eq>=t[2])return{cls:'gold',icon:'🥇',name:'Or',note:`Score ${eq}/108 · Seuil Or cat. ${cat} : ≥${t[2]} pts · Estimation préliminaire`};
  if(eq>=t[1])return{cls:'silver',icon:'🥈',name:'Argent',note:`Score ${eq}/108 · Seuil Or cat. ${cat} : ≥${t[2]} pts · Estimation préliminaire`};
  if(eq>=t[0])return{cls:'bronze',icon:'🥉',name:'Bronze',note:`Score ${eq}/108 · Seuil Argent cat. ${cat} : ≥${t[1]} pts · Estimation préliminaire`};
  return{cls:'blocked',icon:'◌',name:'En dessous du seuil Bronze',note:`Score ${eq}/108 · Seuil Bronze cat. ${cat} : ≥${t[0]} pts`};
}

/* ══ RENDER ══ */
function renderAll(){
  const cs=deriveCriteria();
  const ps=pillarScores(cs);
  const wk=weakestPillar(ps);
  const act=activateFiches(cs);
  const tiers=assignTiers(act,wk);
  tiersCache=tiers;

  let raw=0;SCORED.forEach(q=>{if(answers[q])raw+=answers[q].sc;});
  const eq=toEq(raw);
  const allM=Object.values(PILLARS).flatMap(p=>p.m);
  const mGaps=allM.filter(c=>cs[c]==='u').length;
  const mAss=allM.filter(c=>cs[c]).length;
  const mUnk=allM.length-mAss;
  const cat=computeCat();
  const lv=computeLevel(eq,cat,mGaps);
  const gate=mGaps>0?'closed':mUnk>0?'indet':'open';
  const ratios=pillarAnswerRatios();

  renderFlow();
  renderCatDisplay(cat);
  renderGate(gate,mGaps,mAss,mUnk);
  renderScore(raw,eq,mGaps,mAss,cat);
  renderLevel(lv);
  renderGapNext(eq,cat);
  renderPillars(ps);
  renderSG(ratios);
  renderPrio(ratios);
  renderGaps(tiers[1],act,cs);
  renderActionPlan(tiers);
  renderReco(tiers,gate,wk);
  renderQ20();
}

function renderFlow(){
  const steps=[{n:1,lbl:'Diagnostic',cls:'done'},{n:2,lbl:'Évaluation',cls:'done'},{n:3,lbl:'Positionnement',cls:'cur'},{n:4,lbl:'Plan d\'action',cls:'cur'},{n:5,lbl:'Suivi',cls:'nxt'},{n:6,lbl:'Amélioration',cls:'nxt'}];
  let h='<div class="flow-bar">';
  steps.forEach((s,i)=>{
    h+=`<div class="flow-step ${s.cls}"><div class="flow-n">${s.cls==='done'?'✓':s.n}</div><div class="flow-lbl">${s.lbl}</div></div>`;
    if(i<steps.length-1)h+=`<div class="flow-arr">›</div>`;
  });
  h+='</div>';
  document.getElementById('rFlow').innerHTML=h;
}

function renderCatDisplay(cat){
  document.getElementById('rCat').innerHTML=`<div class="cat-display"><div class="cat-disp-lbl">Catégorie</div><div class="cat-disp-val">${cat}</div><div class="cat-disp-name">${CAT_NAMES[cat]||cat}</div></div>`;
}

function renderGate(g,mG,mA,mU){
  const cfg={
    closed:{lbl:`CONDITION ÉLIMINATOIRE · ${mG} critère(s) M non satisfait(s) sur ${mA} évalués`,body:`<strong>${mG} critère(s) M obligatoire(s) non satisfait(s)</strong> identifiés dans ce questionnaire. La certification est bloquée. Résolvez les fiches Tier 1 ci-dessous. <em>${mU} critères M supplémentaires requièrent un audit complet ARWM.</em>`},
    indet:{lbl:`PÉRIMÈTRE ÉVALUÉ · Aucun critère M bloquant détecté`,body:`Aucune lacune M identifiée sur les ${mA}/36 critères M couverts par ce questionnaire. <em>${mU} critères M ne sont pas couverts ici et requièrent un audit complet avant toute certification.</em>`},
    open:{lbl:`CRITÈRES M SATISFAITS — PÉRIMÈTRE DE CE QUESTIONNAIRE`,body:`Tous les critères M évalués dans ce questionnaire sont satisfaits. Procédez à l'audit complet ARWM pour valider les 36 critères M obligatoires.`}
  };
  const c=cfg[g];
  document.getElementById('rGate').innerHTML=`<div class="gate ${g}"><div class="gate-lbl">${c.lbl}</div><div class="gate-body">${c.body}</div></div>`;
}

function renderScore(raw,eq,mG,mA,cat){
  const t=CAT_TH[cat]||CAT_TH.B;
  const next=eq<t[0]?`Bronze ≥${t[0]}`:eq<t[1]?`Argent ≥${t[1]}`:eq<t[2]?`Or ≥${t[2]}`:'Or atteint';
  document.getElementById('rScore').innerHTML=`
    <div class="sc"><div class="sc-lbl">Score équivalent</div><div class="sc-val">${eq} / 108</div><div class="sc-sub">(brut : ${raw}/38)</div></div>
    <div class="sc"><div class="sc-lbl">Critères M évalués</div><div class="sc-val">${mA} / 36</div><div class="sc-sub">${mG} lacune(s)</div></div>
    <div class="sc"><div class="sc-lbl">Prochain seuil (cat. ${cat})</div><div class="sc-val" style="font-size:14px;line-height:1.4">${next}</div><div class="sc-sub">seuils : ${t[0]} · ${t[1]} · ${t[2]}</div></div>`;
}

function renderLevel(lv){
  document.getElementById('rLevel').innerHTML=`<div class="lvl ${lv.cls}"><div class="lvl-icon">${lv.icon}</div><div><div class="lvl-name">${lv.name}</div><div class="lvl-note">${lv.note}</div></div></div>`;
}

function renderGapNext(eq,cat){
  const t=CAT_TH[cat]||CAT_TH.B;
  let nxtLbl=null,nxtThr=0;
  if(eq<t[0]){nxtLbl='Bronze';nxtThr=t[0];}
  else if(eq<t[1]){nxtLbl='Argent';nxtThr=t[1];}
  else if(eq<t[2]){nxtLbl='Or';nxtThr=t[2];}
  if(!nxtLbl){document.getElementById('rGapNext').innerHTML=`<div class="gap-ind achieved"><div class="gap-ind-meta"><span class="gap-ind-lbl" style="color:var(--vert)">Niveau Or atteint — Catégorie ${cat}</span><span class="gap-ind-pts">${eq}/108 pts</span></div><div class="gap-track"><div class="gap-fill" style="width:100%;background:var(--vert)"></div></div></div>`;return;}
  const gap=nxtThr-eq;
  const pct=Math.min(100,Math.round(eq/nxtThr*100));
  document.getElementById('rGapNext').innerHTML=`<div class="gap-ind"><div class="gap-ind-meta"><span class="gap-ind-lbl">Prochain niveau : ${nxtLbl}</span><span class="gap-ind-pts">Il vous manque <strong>${gap} pts</strong> — score actuel : ${eq}/${nxtThr}</span></div><div class="gap-track"><div class="gap-fill" style="width:${pct}%"></div></div></div>`;
}

function renderPillars(ps){
  let h='';
  Object.keys(ps).forEach(p=>{
    const s=ps[p],pc=PILLARS[p];
    const col=`var(${pc.col})`;
    const mF=s.mAs>0?Math.round(s.mOk/pc.mTot*65)+'%':'0%';
    const gF=s.gAs>0?Math.round(s.gOk/pc.gTot*35)+'%':'0%';

    h+=`<div class="pbar-row"><div class="pbar-meta"><span class="pbar-name" style="color:${col}">${pc.lbl}</span><span class="pbar-info">${inf}</span></div><div class="pbar-track"><div class="pbar-m" style="width:${mF};background:${col}"></div><div class="pbar-g" style="width:${gF};background:${col}"></div></div><div class="pbar-leg"><span>▪ M Obligatoires</span><span>▪ G Complémentaires</span></div></div>`;

function renderSG(ratios){
  const assessed=Object.keys(ratios).filter(p=>ratios[p]!==null);
  if(!assessed.length){document.getElementById('rSG').innerHTML='';return;}
  const sorted=[...assessed].sort((a,b)=>ratios[b]-ratios[a]);
  const topStr=sorted.filter(p=>ratios[p]>=0.6).slice(0,2);
  const topGap=sorted.filter(p=>ratios[p]<=0.45).reverse().slice(0,2);
  const useStr=topStr.length?topStr:sorted.slice(0,Math.min(2,sorted.length));
  const useGap=topGap.length?topGap:sorted.slice(-Math.min(2,sorted.length)).reverse();
  let h='<div class="res-lbl">Points forts & axes d\'amélioration</div><div class="sg-grid">';
  h+='<div class="sg-box str"><div class="sg-title">✓ Points forts</div>';
  useStr.forEach(p=>{h+=`<div class="sg-item"><span>✓</span><span>${PSTR[p]} <small>(${Math.round(ratios[p]*100)}%)</small></span></div>`;});
  h+='</div><div class="sg-box gap"><div class="sg-title">! Axes d\'amélioration</div>';
  useGap.forEach(p=>{h+=`<div class="sg-item"><span style="color:var(--terre)">!</span><span>${PGAP[p]} <small>(${Math.round(ratios[p]*100)}%)</small></span></div>`;});
  h+='</div></div>';
  document.getElementById('rSG').innerHTML=h;
}

/* ══ ACTION PLAN TABLE ══ */
const PLAN_PRI={1:{l:'Urgent',bg:'var(--terre)',fg:'#fff'},2:{l:'Haute',bg:'var(--safran)',fg:'var(--encre)'},3:{l:'Recommandée',bg:'var(--vert)',fg:'#fff'},4:{l:'Recommandée',bg:'var(--vert)',fg:'#fff'},5:{l:'Planifier',bg:'var(--sp)',fg:'var(--encre-d)'},6:{l:'Planifier',bg:'var(--sp)',fg:'var(--encre-d)'}};
const DIFF_L={1:'Faible',2:'Modérée',3:'Avancée'};
const HOR_L={1:'< 3 mois',2:'3–12 mois',3:'> 12 mois'};

function getBenefit(f){
  if(f.b.includes('c'))return 'Économies immédiates';
  if(f.b.includes('b'))return 'Réduction conso. eau';
  if(f.b.includes('e'))return 'Réduction des déchets';
  if(f.b.includes('d'))return 'Ancrage territorial';
  if(f.im>=4)return 'Impact transformationnel';
  if(f.im>=3)return 'Impact élevé';
  return 'Amélioration modérée';
}

function renderActionPlan(tiers){
  const rows=[];
  [1,2,3,4,5,6].forEach(t=>{(tiers[t]||[]).forEach(code=>{if(rows.length<10)rows.push({code,t,f:FICHES[code]});});});
  if(!rows.length){document.getElementById('rActionPlan').innerHTML='';return;}
  let h=`<div class="res-lbl">Plan d'action personnalisé</div><div class="aplan-wrap"><table class="aplan-table"><thead><tr><th>Priorité</th><th>Action</th><th>Fiche</th><th>Difficulté</th><th>Horizon</th><th>Bénéfice attendu</th></tr></thead><tbody>`;
  rows.forEach(({code,t,f})=>{
    const pm=PLAN_PRI[t]||PLAN_PRI[5];
    h+=`<tr><td><span class="plan-pri" style="background:${pm.bg};color:${pm.fg}">${pm.l}</span></td><td><div class="plan-title">${f.t}</div></td><td><span class="fiche-code">${code}</span></td><td>${DIFF_L[f.cx]||'—'}</td><td>${HOR_L[f.ho]||'—'}</td><td>${getBenefit(f)}</td></tr>`;
  });
  h+='</tbody></table></div>';
  document.getElementById('rActionPlan').innerHTML=h;
}

/* ══ FICHE CARDS (TITLE FIRST) ══ */
const IV_L=['','€','€€','€€€'],CX_L=['','Facile','Modérée','Avancée'],IM_L=['','Faible','Moyen','Élevé','Transform.'],RO_L=['','Immédiat','<1 an','1–3 ans','>3 ans'],HO_L=['','Rapide','Moyen terme','Long terme'];

function dots(v,mx,col){let d='';for(let i=0;i<mx;i++)d+=`<span class="dot ${i<v?'on':'off'}" style="color:${col}"></span>`;return d;}
function ind(l,v,mx,vl,col){return`<div class="ind"><div class="ind-l">${l}</div><div class="ind-d">${dots(v,mx,col)}</div><div class="ind-v" style="color:${col}">${vl}</div></div>`;}

function ficheCard(code){
  const f=FICHES[code];
  const col=`var(${PCOL[code[0]]||'--encre'})`;
  const bdgs=f.b.map(bc=>`<span class="fbdg" style="border-color:${col};color:${col}">${BDG_LBL[bc]||bc}</span>`).join('');
  const prio=f.tp==='m'?3:2;
  return`<div class="fiche-card"><div class="fiche-bar" style="background:${col}"></div><div class="fiche-inner">
    <div class="fiche-title">${f.t}</div>
    <div class="fiche-meta"><span class="fiche-code">${code}</span><span class="fiche-sep">·</span><span class="fiche-plbl">${PILLARS[f.p]?.lbl||f.p}</span></div>
    <div class="notation">${ind('Invest.',f.iv,3,IV_L[f.iv],col)}${ind('Complexité',f.cx,3,CX_L[f.cx],col)}${ind('Impact',f.im,4,IM_L[f.im],col)}${ind('Retour',f.ro,4,RO_L[f.ro],col)}${ind('Horizon',f.ho,3,HO_L[f.ho],col)}${ind('Priorité',prio,3,prio===3?'Essentiel':'Recommandé',col)}</div>
    ${bdgs?`<div class="fiche-bdgs">${bdgs}</div>`:''}
  </div></div>`;
}

function renderReco(tiers,gate,wk){
  const TM={
    1:{lbl:'BLOQUANT',bg:'var(--terre)',fg:'#fff',desc:'Critères M non satisfaits — bloquent toute certification'},
    2:{lbl:'PRIORITAIRE',bg:'var(--safran)',fg:'var(--encre)',desc:'Critères M partiellement couverts — à compléter'},

    4:{lbl:'GAIN RAPIDE',bg:'var(--vert)',fg:'#fff',desc:'Actions G à faible investissement, horizon court'},
    5:{lbl:'PROGRESSION',bg:'var(--sauge)',fg:'#fff',desc:'Critères G à effort modéré'},
    6:{lbl:'FEUILLE DE ROUTE',bg:'var(--sp)',fg:'var(--encre-d)',desc:'Actions G à fort investissement — moyen et long terme'},
    k:{lbl:'À ÉVALUER',bg:'var(--sp)',fg:'var(--encre-d)',desc:'Fiches hors périmètre de ce questionnaire — audit complet ARWM requis'}
  };

  if(tiers.k.length){const m=TM.k;h+=`<div class="tier-group" style="margin-top:1.5rem;opacity:.72"><div class="tier-hdr"><span class="tier-bdg" style="background:${m.bg};color:${m.fg}">${m.lbl}</span><span class="tier-cnt">${tiers.k.length} fiche${tiers.k.length>1?'s':''}</span></div><div class="tier-desc">${m.desc}</div><div class="unk-list">${tiers.k.map(code=>`<div class="unk-item"><span class="unk-code">${code}</span><span class="unk-title">${FICHES[code].t}</span></div>`).join('')}</div></div>`;}
  document.getElementById('rReco').innerHTML=h;
}

en:{
label:"ARWM · Association of Restaurateurs of Marrakech-Safi",
title:"Sustainability Diagnostic Questionnaire",
sub:"20 questions · 15–20 min · To be completed by the manager or operations lead",
intro:"This questionnaire has one objective: <strong>to position you honestly where you are today</strong>. Answer based on <strong>what actually happens in practice</strong>, not what is planned.",
note:"<strong>How to answer:</strong> Choose A, B, or C. When in doubt, select what best describes your usual situation. <strong>Scoring:</strong> A = 2 pts · B = 1 pt · C = 0 pts · Score out of 38 (equivalent to 108).",
cat_step:"Preliminary Step",
cat_title:"Establishment Category",
cat_intro:"Before assessing your practices, identify your establishment's dominant operating model. This category is used to apply fair, context-appropriate evaluation thresholds.",
cat_left:"High volume",cat_right:"High personalisation",
cat_A_name:"Fast-casual / High volume",cat_A_desc:"Fast rotation, standardised processes, intensive activity.",
cat_B_name:"Mid-scale / Mixed",cat_B_desc:"Table service, varied operations, intermediate footfall.",
cat_C_name:"Premium / Small volume",cat_C_desc:"Personalised experience, low volume, precise operations.",
cat_note:"These categories do not reflect quality or commercial positioning. They ensure a fair evaluation adapted to each model.",
cat_required:"Please select your establishment category before continuing.",
crit_m_title:"Fundamental criteria (M)",
crit_m_desc:"Essential requirements. A single unmet M criterion blocks access to any certification level.",
crit_g_title:"Complementary criteria (G)",
crit_g_desc:"Progression criteria rewarding advanced initiatives and contributing to the total score.",
gov_title:"Governance & Management",gov_desc:"Structure your approach, monitor consumption and engage teams around shared objectives.",
dec_title:"Waste Management",dec_desc:"Prevent, sort and valorise: from food waste to packaging.",
eau_title:"Water & Energy",eau_desc:"Control water consumption, reduce your energy footprint and move toward renewables.",
app_title:"Sustainable Procurement",app_desc:"Local, seasonal, traceable: embed responsible criteria into your purchasing decisions.",
per_title:"Staff & Operations",per_desc:"Train teams, formalise practices and embed sustainability in daily operations.",
pfLabel:"Identification",
pf_name:"Restaurant name",pf_name_ph:"e.g. Riad Al Baraka",
pf_resp:"Respondent name",pf_resp_ph:"First Last",
pf_role:"Role",pf_role_ph:"e.g. Manager, Chef",
pf_date:"Date",pf_covers:"Covers / day",pf_covers_ph:"e.g. 80",
q17_t:"Do you track at least one resource consumption indicator monthly (water, energy, waste, food cost)?",
q17a:"Yes, at least two indicators tracked monthly",q17b:"We track one, occasionally, irregularly",q17c:"No, no systematic tracking",
q18_t:"Have you estimated the cost of food waste in your establishment (as % of purchases or MAD per month)?",
q18a:"Yes, we have an estimate and it guides purchasing decisions",q18b:"We have a general sense, nothing quantified",q18c:"No, the cost of waste has never been quantified",
q19_t:"Have you explored any sustainability certification, label, or partnership program (ARWM, national label, etc.)?",
q19a:"Yes, a process is underway or a label has been obtained",q19b:"We expressed interest, but no formal process has begun",q19c:"No, this has never been explored",
q1_t:"Do you have an approximate idea of the volume of food waste produced daily?",q1_n:"E.g.: weight estimate in kg, number of bins emptied, or informal written log.",
q1a:"Yes, we measure or estimate it regularly",q1b:"We have a rough idea, nothing formalised",q1c:"No, no visibility on our food waste",
q2_t:"How is your waste handled at the end of service?",q2_n:"Describe what actually happens.",
q2a:"Active sorting: organic, dry recyclables and general waste separated",q2b:"Partial or inconsistent sorting depending on team",q2c:"Everything goes in one bin",
q3_t:"What do you do with your used cooking oil?",
q3a:"Collected by a specialised service (Ekogeste or equivalent)",q3b:"We are looking for a solution, nothing in place yet",q3c:"Discarded with general waste or poured down drains",
q4_t:"What do you do with unsold food at the end of service?",
q4a:"Valorised: redistributed, transformed, or via a platform (Foodeals, Savey)",q4b:"Partly valorised, partly discarded — no defined system",q4c:"Systematically discarded at end of each service",
q5_t:"Do you know your approximate monthly water bill?",q5_n:"Not the exact figure — just whether you have a benchmark.",
q5a:"Yes, we monitor it and know our monthly consumption",q5b:"We have a rough idea, but no regular tracking",q5c:"No, no visibility on our water consumption",
q6_t:"Are water-saving devices installed in your kitchen and bathrooms?",q6_n:"E.g.: tap aerators, push-button taps, dual-flush toilets.",
q6a:"Yes, multiple devices in place (kitchen and/or bathrooms)",q6b:"One or two devices, but not systematically",q6c:"No specific water-saving equipment",
q7_t:"Have you checked for water leaks in your establishment in the past six months?",
q7a:"Yes, recent check — no unrepaired leaks",q7b:"No systematic check, but we act on visible problems",q7c:"We have never specifically checked for leaks",
q8_t:"Have you reduced single-use plastic (bottles, packaging, sachets)?",q8_n:"E.g.: filtered water system (Castalie), kraft packaging for delivery.",
q8a:"Yes, single-use plastic mostly eliminated or replaced",q8b:"We have started reducing, but it is still partial",q8c:"No, standard plastic bottles and packaging still in place",
q9_t:"What share of your food purchases comes from local or regional suppliers?",q9_n:"Local = Marrakech and province; regional = Morocco.",
q9a:"More than 60% of our food purchases are local or regional",q9b:"Between 30% and 60%, depending on availability and season",q9c:"Less than 30%, or we do not have visibility on this",
q10_t:"Do you have a direct relationship with at least one producer or farm that supplies you regularly (without a market intermediary)?",
q10a:"Yes, at least one direct relationship with an identified producer",q10b:"We know our wholesalers, but not the producers directly",q10c:"We buy exclusively at market or through unidentified intermediaries",
q11_t:"Does your menu indicate the local origin of certain products or flag seasonal dishes?",q11_n:"Even a simple mention like 'market vegetables' counts.",
q11a:"Yes, origin or seasonal character is mentioned on the menu",q11b:"We communicate this verbally, but it is not written on the menu",q11c:"No mention of this kind in our customer communication",
q12_t:"Have you mapped your suppliers, identifying which are local, regional, or imported?",q12_n:"An informal list counts — the important thing is to have visibility.",
q12a:"Yes, we know the geographic origin of our main suppliers",q12b:"Partially — for some categories but not all",q12c:"No, we do not have this visibility on our suppliers",
q13_t:"Have your teams received any training or briefing on at least one sustainability practice in the past 12 months?",q13_n:"Even an informal 10-minute team briefing counts.",
q13a:"Yes, at least one formalised training or awareness session",q13b:"Verbal instructions were given, but no dedicated session",q13c:"No specific training or sensitisation has taken place",
q14_t:"Is there an identified person in your establishment who monitors sustainability or resource-saving initiatives?",
q14a:"Yes, one person is clearly designated and active on these topics",q14b:"It is managed collectively, with no designated owner",q14c:"No one specifically monitors these topics",
q15_t:"Do you have written or posted procedures (SOPs, checklists) for waste sorting, water use, or equipment shutdown?",
q15a:"Yes, written procedures exist and are posted or accessible to the team",q15b:"Verbal instructions exist, but nothing is written or displayed",q15c:"No procedures of this kind in our establishment",
q16_t:"Do you use an order management or inventory system in the kitchen to anticipate purchasing?",q16_n:"E.g.: POS with inventory, Excel spreadsheet, OCHI system.",
q16a:"Yes, a tool is in place and used daily",q16b:"Yes but irregularly, or the tool is being deployed",q16c:"No, everything is managed from memory without tracking",
q20_t:"In one sentence: what is the single operational habit in your kitchen that you know could change tomorrow?",
q20_n:"Open question — not scored. Your answer becomes your first action.",q20_lbl:"Your answer",q20_ph:"e.g. We could stop throwing away bread at end of service…",
calcBtn:"Calculate my profile →",

q18a:"نعم، لدينا تقدير ويوجه قرارات الشراء",q18b:"لدينا إحساس عام لكن لا شيء مُكمَّم",q18c:"لا، لم نحسب قط تكلفة الهدر",

q1_t:"هل لديك فكرة تقريبية عن حجم النفايات الغذائية المنتجة يومياً؟",q1_n:"مثال: تقدير بالكيلوغرام أو عدد الحاويات المفرغة.",
q1a:"نعم، نقيسها أو نقدرها بانتظام",q1b:"لدينا فكرة تقريبية لكن لا شيء رسمي",q1c:"لا، ليس لدينا أي تصور",
q2_t:"كيف تتم إدارة النفايات في نهاية الخدمة؟",q2_n:"صف ما يحدث فعلاً.",
q2a:"فرز فعّال: عضوي وقابل للتدوير ونفايات عامة منفصلة",q2b:"فرز جزئي أو غير منتظم",q2c:"كل شيء في حاوية واحدة",
q3_t:"ماذا تفعل بزيت القلي المستعمل؟",
q3a:"جمع منظم من قِبَل مزود متخصص (Ekogeste أو ما يعادله)",q3b:"نبحث عن حل لكن لا شيء في مكانه",q3c:"يُرمى مع النفايات أو يُصب في الصرف",
q4_t:"ماذا تفعل بالطعام غير المباع في نهاية الخدمة؟",
q4a:"يُثمَّن: يُعاد توزيعه أو يُحوَّل أو عبر منصة (Foodeals, Savey)",q4b:"جزء يُثمَّن وجزء يُرمى دون نظام",q4c:"يُرمى بشكل منهجي في نهاية كل خدمة",
q5_t:"هل تعرف فاتورتك المائية الشهرية التقريبية؟",q5_n:"لا يُشترط المبلغ الدقيق — مجرد وجود مرجع.",
q5a:"نعم، نتابعها ونعرف استهلاكنا الشهري",q5b:"لدينا فكرة تقريبية لكن لا متابعة منتظمة",q5c:"لا، لا رؤية لدينا على استهلاك الماء",
q6_t:"هل ثُبِّتت أجهزة توفير الماء في مطبخك ومراحيضك؟",q6_n:"مثال: مُهوِّيات الصنابير، صنابير بالضغط، مراحيض ذات تدفق مزدوج.",
q6a:"نعم، عدة أجهزة مثبتة",q6b:"جهاز أو جهازان فقط ليس بشكل منهجي",q6c:"لا أجهزة خاصة لتوفير الماء",
q7_t:"هل تحققت من تسرب المياه في مؤسستك خلال الستة أشهر الماضية؟",

q11a:"نعم، المصدر أو الطابع الموسمي مذكور في القائمة",q11b:"نتحدث عن ذلك شفهياً لكنه غير مكتوب",q11c:"لا إشارة من هذا القبيل في تواصلنا مع الزبائن",

q12a:"نعم، نعرف الأصل الجغرافي لموردينا الرئيسيين",q12b:"جزئياً لبعض الفئات",q12c:"لا، ليس لدينا هذه الرؤية",
q13_t:"هل تلقّت فرقك توعية حول ممارسة بيئية خلال الـ 12 شهراً الماضية؟",q13_n:"حتى إحاطة غير رسمية مدتها 10 دقائق تُحتسب.",

/* ══ LANG SWITCH ══ */
function setLang(l){
  lang=l;
  document.documentElement.lang=l;
  document.documentElement.dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('.lb-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.lb-btn[onclick="setLang('${l}')"]`).classList.add('active');
  const t=T[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.getAttribute('data-i18n');if(t[k]!==undefined)el.innerHTML=t[k];});
  document.querySelectorAll('[data-phi]').forEach(el=>{const k=el.getAttribute('data-phi');if(t[k]!==undefined)el.placeholder=t[k];});
  updateProg();
  if(document.getElementById('resWrap').classList.contains('show'))renderAll();
}
